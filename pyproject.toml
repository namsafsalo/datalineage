[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "namsafsalo-datalineage"
version = "0.1.0"
description = "沿版本链记录每次变更的内容、原因与影响范围"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "namsafsalo" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://namsafsalo.github.io"
Repository = "https://github.com/namsafsalo/datalineage"
Issues = "https://github.com/namsafsalo/datalineage/issues"

[project.scripts]
datalineage = "datalineage:main"

[tool.setuptools]
py-modules = ["datalineage"]
